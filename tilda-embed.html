<!-- ==== ЛЕНТА ВКОНТАКТЕ (автообновление) ==== -->
<div id="vkf">
  <div class="vkf-wrap">
    <button class="vkf-arrow vkf-prev" type="button" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="vkf-track"><div class="vkf-msg">Загрузка…</div></div>
    <button class="vkf-arrow vkf-next" type="button" aria-label="Вперёд"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<div id="vkf-modal" aria-hidden="true">
  <div class="vkf-modal-box" role="dialog" aria-modal="true">
    <button class="vkf-close" type="button" aria-label="Закрыть">&times;</button>
    <div class="vkf-modal-body"></div>
  </div>
</div>

<style>
#vkf,#vkf-modal{font-family:'TildaSans',Arial,Helvetica,sans-serif;}
#vkf{max-width:1200px;margin:0 auto;padding:0 8px;}
#vkf *,#vkf-modal *{box-sizing:border-box;}
#vkf .vkf-wrap{position:relative;}
#vkf .vkf-track{display:flex;gap:30px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:6px 2px 18px;-ms-overflow-style:none;scrollbar-width:none;cursor:grab;}
#vkf .vkf-track.vkf-grab{cursor:grabbing;scroll-behavior:auto;}
#vkf .vkf-track::-webkit-scrollbar{display:none;height:0;}
#vkf .vkf-card{flex:0 0 296px;scroll-snap-align:start;cursor:pointer;display:flex;flex-direction:column;gap:18px;transition:transform .28s ease;}
#vkf .vkf-card:hover{transform:translateY(-5px);}
#vkf .vkf-pic{position:relative;padding-top:74%;border-radius:18px;overflow:hidden;background:#EDEDED;}
#vkf .vkf-pic img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;}
#vkf .vkf-ni{padding-top:74%;border-radius:18px;background:#F2EFEC;}
#vkf .vkf-h{font-size:19px;line-height:1.36;font-weight:600;color:#2B2B2B;margin:0;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;}
#vkf .vkf-d{font-size:13px;line-height:1.2;color:#9C9C9C;margin:0;}
#vkf .vkf-arrow{position:absolute;top:33%;transform:translateY(-50%);width:48px;height:48px;border:0;border-radius:50%;background:#111;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:6;transition:opacity .22s,background .22s;padding:0;}
#vkf .vkf-arrow svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
#vkf .vkf-arrow:hover{background:#3A3A3A;}
#vkf .vkf-prev{left:-56px;}
#vkf .vkf-next{right:-56px;}
#vkf .vkf-arrow[disabled]{opacity:0;pointer-events:none;}
#vkf .vkf-msg{padding:36px 0;color:#9C9C9C;font-size:15px;}
#vkf-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(18,18,18,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:24px;z-index:999999;}
#vkf-modal.vkf-on{display:flex;}
#vkf-modal .vkf-modal-box{position:relative;background:#fff;border-radius:22px;width:100%;max-width:760px;max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:46px 46px 40px;box-shadow:0 24px 70px rgba(0,0,0,.28);}
#vkf-modal .vkf-close{position:absolute;top:8px;right:14px;background:none;border:0;font-size:34px;line-height:1;color:#9C9C9C;cursor:pointer;padding:8px 12px;}
#vkf-modal .vkf-close:hover{color:#111;}
#vkf-modal .vkf-mt{font-size:25px;line-height:1.3;font-weight:600;color:#2B2B2B;margin:0 40px 10px 0;}
#vkf-modal .vkf-md{font-size:13px;color:#9C9C9C;margin:0 0 22px;}
#vkf-modal .vkf-mg{display:flex;flex-direction:column;gap:12px;margin:0 0 22px;}
#vkf-modal .vkf-mg img{width:100%;border-radius:14px;display:block;}
#vkf-modal .vkf-mb{font-size:16px;line-height:1.62;color:#3C3C3C;white-space:pre-line;word-wrap:break-word;overflow-wrap:break-word;}
#vkf-modal .vkf-ml{display:inline-block;margin-top:26px;font-size:15px;color:#E8794A;text-decoration:none;border-bottom:1px solid rgba(232,121,74,.35);padding-bottom:2px;}
#vkf-modal .vkf-ml:hover{border-bottom-color:#E8794A;}
@media (max-width:1340px){#vkf .vkf-prev{left:-6px;}#vkf .vkf-next{right:-6px;}}
@media (max-width:900px){
 #vkf .vkf-arrow{display:none;}
 #vkf .vkf-card{flex:0 0 72vw;}
 #vkf .vkf-track{gap:18px;}
 #vkf-modal{padding:0;align-items:flex-end;}
 #vkf-modal .vkf-modal-box{max-height:92vh;border-radius:22px 22px 0 0;padding:36px 22px 30px;}
 #vkf-modal .vkf-mt{font-size:21px;}
}
</style>

<script>
(function () {
  /* Адрес данных. После настройки GitHub замените на свой:
     https://raw.githubusercontent.com/ЛОГИН/РЕПОЗИТОРИЙ/main/feed.json */
  var FEED = "https://raw.githubusercontent.com/USER/REPO/main/feed.json";
  var BASE = FEED.replace(/\/[^\/]*$/, "/");

  var LIMIT = 130, MIN = 22;
  var ROOT = document.getElementById("vkf");
  if (!ROOT) return;
  var MODAL = document.getElementById("vkf-modal");
  var track = ROOT.querySelector(".vkf-track");
  var modalBody = MODAL.querySelector(".vkf-modal-body");
  var DATA = [];

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function fmt(p) {
    if (p.date) { var a = p.date.split("-"); return a[2] + "." + a[1] + "." + a[0]; }
    return "";
  }

  function isEmoji(ch) {
    var c = ch.codePointAt(0);
    return (c >= 0x1F300 && c <= 0x1FAFF) || (c >= 0x2600 && c <= 0x27BF) ||
           (c >= 0x2190 && c <= 0x21FF) || (c >= 0x2B00 && c <= 0x2BFF) ||
           c === 0xFE0F || c === 0x2049 || c === 0x203C;
  }

  function cutTitle(s) {
    if (s.length <= LIMIT) return { title: s, rest: "" };
    var cut = -1, acc = "";
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i);
      if (isEmoji(ch) && i >= MIN && i <= LIMIT) { cut = i; break; }
      acc += ch;
      if ("!?.\u2026".indexOf(ch) > -1 && /\s/.test(s.charAt(i + 1) || "")) {
        if (acc.trim().length <= LIMIT) { cut = i + 1; if (acc.trim().length >= MIN) break; }
        else break;
      }
    }
    if (cut > 0) {
      var head = s.slice(0, cut).trim().replace(/[\s,;:\u2013\u2014-]+$/, "");
      var tail = s.slice(cut).replace(/^[\s,;:\u2013\u2014-]+/, "").trim();
      if (head.length >= MIN) return { title: head, rest: tail };
    }
    var h = s.slice(0, LIMIT).replace(/\s+\S*$/, "").replace(/[\s,;:\u2013\u2014-]+$/, "");
    return { title: h + "\u2026", rest: s.slice(h.length).replace(/^[\s,.:;\u2013\u2014-]+/, "").trim() };
  }

  function split(text) {
    var t = String(text || "").replace(/\r/g, "").trim();
    if (!t) return { title: "Запись", body: "" };
    var lines = t.split("\n");
    var idx = 0;
    while (idx < lines.length && !lines[idx].trim()) idx++;
    var first = (lines[idx] || "").trim();
    var r = cutTitle(first);
    var restLines = lines.slice(idx + 1).join("\n").replace(/^\s+/, "");
    var body = r.rest ? (r.rest + (restLines ? "\n" + restLines : "")) : restLines;
    return { title: r.title, body: body.trim() };
  }

  function draw() {
    if (!DATA.length) { track.innerHTML = '<div class="vkf-msg">Записей пока нет.</div>'; return; }
    var html = "";
    DATA.forEach(function (p, i) {
      var s = split(p.text);
      var first = (p.img && p.img[0]) ? BASE + p.img[0] : "";
      var pic = first
        ? '<div class="vkf-pic"><img loading="lazy" alt="" src="' + esc(first) + '"></div>'
        : '<div class="vkf-ni"></div>';
      html += '<article class="vkf-card" data-i="' + i + '">' + pic +
              '<h3 class="vkf-h">' + esc(s.title) + "</h3>" +
              '<p class="vkf-d">' + fmt(p) + "</p></article>";
    });
    track.innerHTML = html;
    refresh();
  }

  function open(i) {
    var p = DATA[i]; if (!p) return;
    var s = split(p.text);
    var pics = (p.img || []).map(function (u) {
      return '<img loading="lazy" alt="" src="' + esc(BASE + u) + '">';
    }).join("");
    modalBody.innerHTML =
      '<h2 class="vkf-mt">' + esc(s.title) + "</h2>" +
      '<p class="vkf-md">' + fmt(p) + "</p>" +
      (pics ? '<div class="vkf-mg">' + pics + "</div>" : "") +
      (s.body ? '<div class="vkf-mb">' + esc(s.body) + "</div>" : "") +
      (p.url ? '<a class="vkf-ml" target="_blank" rel="noopener" href="' + esc(p.url) + '">Смотреть во ВКонтакте \u2192</a>' : "");
    MODAL.classList.add("vkf-on");
    MODAL.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    MODAL.querySelector(".vkf-modal-box").scrollTop = 0;
  }

  function close() {
    MODAL.classList.remove("vkf-on");
    MODAL.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  }

  MODAL.addEventListener("click", function (e) {
    if (e.target === MODAL || (e.target.className || "").indexOf("vkf-close") > -1) close();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });

  var moved = false, sx = 0, sy = 0;
  track.addEventListener("click", function (e) {
    if (moved) return;
    var card = e.target.closest ? e.target.closest(".vkf-card") : null;
    if (card) open(+card.getAttribute("data-i"));
  });

  function refresh() {
    var max = track.scrollWidth - track.clientWidth;
    ROOT.querySelector(".vkf-prev").disabled = track.scrollLeft <= 4;
    ROOT.querySelector(".vkf-next").disabled = track.scrollLeft >= max - 4;
  }
  ROOT.querySelector(".vkf-prev").addEventListener("click", function (e) {
    e.stopPropagation(); track.scrollBy({ left: -(track.clientWidth * 0.8), behavior: "smooth" });
  });
  ROOT.querySelector(".vkf-next").addEventListener("click", function (e) {
    e.stopPropagation(); track.scrollBy({ left: track.clientWidth * 0.8, behavior: "smooth" });
  });
  track.addEventListener("scroll", refresh);
  window.addEventListener("resize", refresh);

  track.addEventListener("mousedown", function (e) {
    moved = false; sx = e.pageX; sy = e.pageY;
    track.classList.add("vkf-grab");
  });
  track.addEventListener("mousemove", function (e) {
    if (!track.classList.contains("vkf-grab")) return;
    var dx = e.pageX - sx, dy = e.pageY - sy;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    if (moved && Math.abs(dx) > Math.abs(dy)) {
      e.preventDefault();
      track.scrollLeft -= (e.movementX || 0) * 1.15;
    }
  });
  window.addEventListener("mouseup", function () {
    if (!track.classList.contains("vkf-grab")) return;
    track.classList.remove("vkf-grab");
    setTimeout(function () { moved = false; }, 60);
  });

  var bust = Math.floor(Date.now() / 600000);
  fetch(FEED + (FEED.indexOf("?") > -1 ? "&" : "?") + "t=" + bust, { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (j) { DATA = (j.items || []); draw(); })
    .catch(function (e) {
      if (window.console) console.warn("[vkf]", e && e.message);
      track.innerHTML = '<div class="vkf-msg">Не удалось загрузить ленту.</div>';
    });
})();
</script>
<!-- ==== /ЛЕНТА ==== -->
